
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student Marks Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 40px 15px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 12px #cccccc;
        }

        h2 {
            text-align: center;
            color: #243b64;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 6px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #2456a6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Student Marks Calculator</h2>

        <form action="calculate" method="post">
            <label for="name">Student Name:</label>
            <input type="text" id="name" name="studentName"
                   maxlength="100" required>

            <label for="subject1">Subject 1 Marks:</label>
            <input type="number" id="subject1" name="subject1"
                   min="0" max="100" step="any" required>

            <label for="subject2">Subject 2 Marks:</label>
            <input type="number" id="subject2" name="subject2"
                   min="0" max="100" step="any" required>

            <label for="subject3">Subject 3 Marks:</label>
            <input type="number" id="subject3" name="subject3"
                   min="0" max="100" step="any" required>

            <button type="submit">Calculate Result</button>
        </form>
    </div>
</body>
</html>
